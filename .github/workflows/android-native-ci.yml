name: Android Native CI
on:
  push:
    branches: [work/android-native-compose]
    paths: ["apps/android/**", ".github/workflows/android-native-ci.yml"]
  pull_request:
    paths: ["apps/android/**", ".github/workflows/android-native-ci.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Assemble debug APK
        working-directory: apps/android
        run: gradle :app:assembleDebug
      - name: Run Room instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 600
          disable-animations: true
          script: cd apps/android && gradle :app:connectedDebugAndroidTest
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
