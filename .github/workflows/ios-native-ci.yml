name: iOS Native CI
on:
  push:
    branches: [work/ios-native-swiftui]
    paths: ["apps/ios/**", ".github/workflows/ios-native-ci.yml"]
  pull_request:
    paths: ["apps/ios/**", ".github/workflows/ios-native-ci.yml"]
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Build iOS simulator app
        working-directory: apps/ios
        run: xcodebuild -project LifeOS.xcodeproj -scheme LifeOS -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
