name: Mobile CI
on:
  pull_request:
    branches: [main]
    paths: ["apps/mobile/**"]
  push:
    branches: [work/frontend-foundation]
    paths: ["apps/mobile/**"]
jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package.json
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx expo export --platform all
