name: LifeOS
options:
  bundleIdPrefix: com.lifeos
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  LifeOS:
    type: application
    platform: iOS
    sources:
      - path: LifeOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lifeos.ios
        INFOPLIST_KEY_CFBundleDisplayName: LifeOS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES

  LifeOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LifeOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lifeos.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LifeOS:
    build:
      targets:
        LifeOS: all
        LifeOSTests: [test]
    test:
      targets:
        - LifeOSTests
